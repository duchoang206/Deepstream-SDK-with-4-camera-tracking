<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepStream 4-Camera Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 40px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .main-content {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h2 {
            margin: 0;
            font-weight: 400;
            color: #cbd5e1;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-badge .dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
        }

        .video-container {
            flex: 1;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Vision Intelligence</h1>
        <div class="nav-item">LIVE Dashboard</div>
        <div class="nav-item" style="background: transparent; opacity: 0.5;">Analytics</div>
        <div class="nav-item" style="background: transparent; opacity: 0.5;">Settings</div>
    </div>
    <div class="main-content">
        <div class="header">
            <h2>4-Camera WebRTC Stream (Zero Delay)</h2>
            <div class="status-badge">
                <div class="dot"></div>
                LIVE
            </div>
        </div>
        <div class="video-container">
            <!-- Embedding MediaMTX WebRTC Player -->
            <iframe src="http://localhost:8081/ds-test"></iframe>
        </div>
    </div>
</body>
</html>
